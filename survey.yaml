planner:
  targets:
  - id: identity
    label: a face or identity
  - id: voice
    label: a voice or speaker
  - id: style
    label: an art style or copyrighted work
  - id: nsfw
    label: NSFW or harmful content
  - id: class
    label: an object class
  - id: knowledge
    label: a fact or private knowledge
  - id: backdoor
    label: a backdoor or poisoned data
  - id: preference
    label: a user preference
  models:
  - id: vlm
    label: a VLM or MLLM
  - id: clip
    label: a CLIP-style encoder
  - id: image-diffusion
    label: an image diffusion model
  - id: video
    label: a video model
  - id: audio
    label: an audio or speech model
  constraints:
  - id: none
    label: any limit
  - id: no-retraining
    label: retraining
  - id: keep-weights
    label: changing the base weights
  stage_rules:
    data-side:
      no-retraining:
        fit: 'no'
        reason: It changes what future training sees.
        why: reduce the learnability of targeted clusters
      keep-weights:
        fit: 'no'
        reason: It changes the training data, so it cannot edit a model that is already trained.
        why: introduce perturbations that prevent models from learning from protected samples
    training-time:
      no-retraining:
        fit: 'no'
        reason: It updates the model by optimization.
        why: updates parameters so that responses on the forget set degrade
      keep-weights:
        fit: 'no'
        reason: It changes the weights.
        why: updates parameters so that responses on the forget set degrade
    architecture:
      no-retraining:
        fit: 'no'
        reason: Pruning is followed by light fine-tuning.
        why: modality-aware pruning with light fine-tuning
      keep-weights:
        fit: 'no'
        reason: It changes the network structure.
        why: modifying network structure through pruning, freezing, or controlled regrowth
    training-free:
      no-retraining:
        fit: fits
        reason: It uses closed-form edits instead of training.
        why: replaces iterative optimization with closed-form edits in parameter space
      keep-weights:
        fit: partly
        reason: Projecting activations keeps the weights; weight-space edits change them.
        why: Instead of updating model parameters, these methods suppress target concepts by projecting internal activations
    decoding-time:
      no-retraining:
        fit: fits
        reason: It changes the sampler, not the model.
        why: modifying the sampler rather than the model parameters
      keep-weights:
        fit: fits
        reason: The base checkpoint stays fixed.
        why: The base checkpoint remains fixed
  gap_links:
    audio: temporal-dynamic
    video: temporal-dynamic
    default: cross-modal-generalization

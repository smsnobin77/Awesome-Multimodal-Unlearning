dimensions:
- id: forget-quality
  name: Forget quality and safety
  side: forget
  metrics:
  - id: ua
    name: UA
    description: 'Unlearning Accuracy (UA) measures forgetting efficacy as the complement of predictive accuracy on the forget
      set: where D_f denotes the subset designated for removal.'
    formula: \mathrm{UA} = 100\% - \mathrm{Accuracy}(D_f),
    keys:
    - wu2025munba
    - schioppa2024model
    - sendera2025semu
    - pathak2025quantum
    - aravindan2025sealing
    - jha2025backdoor
    models: []
    why: []
  - id: fa-k
    name: FA@K
    description: For VLMs with zero-shot prediction, FA@k measures whether the true label of a forget example appears among
      the top-k model predictions.
    formula: \mathrm{FA}@k = \frac{1}{\lvert D_f\rvert} \sum_{(x,y)\in D_f} \mathbf{1}\!\left\{\, y \in \operatorname{Top\text{-}k}\!\big(f(x)\big)
      \,\right\}.
    keys:
    - caitargeted2025
    models:
    - clip
    - vlm
    why:
    - For VLMs with zero-shot prediction
  - id: wasserstein-distance
    name: Wasserstein distance
    description: Distributional change in concept scores before and after unlearning can be quantified using the 1-Wasserstein
      distance.
    formula: \gamma = \frac{W_1(A,B)}{W_1(B,R)},
    keys:
    - solomon2014earth
    - tong2021diffusion
    models: []
    why: []
  - id: clip-cls-drop
    name: CLIP-Cls Drop
    description: Concept erasure in image generation can be verified through classification performance on generated samples.
    formula: \Delta_{\mathrm{cls}}=\frac{1}{n}\sum_{i=1}^{n} c\!\left(x_i^{\mathrm{pre}}\right) -\frac{1}{n}\sum_{i=1}^{n}
      c\!\left(x_i^{\mathrm{post}}\right).
    keys:
    - gandikota2023erasing
    - lu2024mace
    models:
    - image-diffusion
    why:
    - Concept erasure in image generation
  - id: clip-sim-drop
    name: CLIP-Sim Drop
    description: CLIP image-text similarity provides a continuous signal of residual concept alignment.
    formula: s_{\mathrm{pre}} = \frac{1}{n}\sum_{i=1}^{n}\cos\!\big(f_{\mathrm{img}}(x_i^{\mathrm{pre}}),\, f_{\mathrm{text}}(t)\big)
    keys:
    - gandikota2023erasing
    - rusanovsky2025memories
    - wang2025precise
    models:
    - image-diffusion
    why:
    - CLIP image-text similarity provides a continuous signal of residual concept alignment
- id: safety-content
  name: Safety and content forgetting
  side: forget
  metrics:
  - id: refusal-rate
    name: Refusal Rate
    description: Also referred to as rejection rate, Refusal Rate (RR) measures how often the model refuses harmful queries
      after unlearning.
    formula: RR = \frac{1}{\lvert D\rvert} \sum_{i=1}^{\lvert D\rvert} I_R\!\left(R_i\right),
    keys:
    - chen2025safety
    models:
    - vlm
    why:
    - evaluation set of harmful text-image inputs
  - id: vlm-as-judge
    name: VLM-as-Judge
    description: Pretrained VLMs can serve as external judges for presence of a forbidden concept.
    formula: \Delta_{\mathrm{VQA}} = \frac{1}{n}\sum_{i=1}^{n} g(y_i^{\mathrm{pre}}) - \frac{1}{n}\sum_{i=1}^{n} g(y_i^{\mathrm{post}}),
    keys:
    - lin2024evaluating
    models: []
    why: []
  - id: inappropriate-content-rate
    name: Inappropriate Content Rate
    description: This metric measures how often a model produces unsafe content under sensitive prompts.
    formula: null
    keys:
    - schramowski2023safe
    - wang2024moderator
    models:
    - image-diffusion
    why:
    - In image generation, a standard protocol samples outputs
- id: attack-privacy
  name: Attack-based privacy
  side: forget
  metrics:
  - id: mia
    name: MIA
    description: Membership Inference Attacks (MIA) are a standard privacy test for evaluating whether an unlearned model
      still leaks information about forgotten data.
    formula: \mathrm{MIA} = \frac{1}{\lvert D_f \rvert} \sum_{x_i \in D_f} \mathbf{1}\!\big[\,A(F_T, x_i) \in \{0,1\}\,\big],
    keys:
    - shokri2017membership
    - carlini2022membership
    - jia2023model
    - wang2025membership
    - dontsov2024clear
    - wang2025muc
    - koudounas2025alexa
    models: []
    why: []
  - id: identity-matching
    name: Identity Matching
    description: Identity leakage metrics assess whether model outputs still reveal a forgotten identity after unlearning.
    formula: null
    keys:
    - biswas2025cure
    - caitargeted2025
    - nagasubramaniam2025prompting
    - liu2024metacloak
    - wu2025unlearning
    - dontsov2024clear
    - ma2024benchmarking
    models: []
    why: []
  - id: sim
    name: SIM
    description: In speech unlearning, privacy evaluation assesses whether a model can still recognize or reproduce a forgotten
      speaker after unlearning.
    formula: null
    keys:
    - chen2022wavlm
    - kim2025not
    models:
    - audio
    why:
    - In speech unlearning, privacy evaluation
  - id: spk-zrf
    name: spk-ZRF
    description: In speech unlearning, privacy evaluation assesses whether a model can still recognize or reproduce a forgotten
      speaker after unlearning.
    formula: \mathrm{spk\text{-}ZRF} = 1 - \frac{1}{n_f} \sum_{i=1}^{n_f} JSD_i,
    keys:
    - chen2022wavlm
    - kim2025not
    models:
    - audio
    why:
    - In speech unlearning, privacy evaluation
- id: utility
  name: Utility and faithfulness
  side: retain
  metrics:
  - id: top-k-acc
    name: Top-k Acc
    description: 'Retained utility on non-forgotten data is commonly measured by Top-k classification accuracy on remaining
      classes: where y_i denotes the ground-truth label and 𝐩̂_i the predicted class scores.'
    formula: \mathrm{Top\text{-}k\ Acc} = \frac{1}{N}\sum_{i=1}^{N}\mathbf{1}\!\left[\,y_i \in \mathrm{Top\text{-}k}\big(\hat{\mathbf{p}}_i\big)\,\right],
    keys:
    - bansal2023cleanclip
    - struppek2024exploiting
    - han2025unlearning
    - biswas2025cure
    models: []
    why: []
  - id: recall-k
    name: Recall@K
    description: 'For multimodal models, utility retention is evaluated using retrieval metrics such as Recall@K and R-Precision
      on held-out benchmarks:'
    formula: \mathrm{Recall@}K = \frac{1}{N}\sum_{i=1}^{N} \mathbf{1}\!\left[\,R(q_i)\cap \mathrm{TopK}(q_i)\neq\varnothing\,\right].
    keys:
    - yang2024cliperase
    - sinha2025multi
    models: []
    why: []
  - id: bleu
    name: BLEU
    description: Retained capability on non-forgotten data is tracked with standard NLP scores.
    formula: null
    keys:
    - zhang2025does
    - dontsov2024clear
    - liu2024large
    - hessel2021clipscore
    - yang2024cliperase
    - cheng2024multidelete
    models:
    - vlm
    why:
    - For VLMs that perform question answering or caption generation
  - id: clip-score
    name: CLIP Score
    description: Retained capability on non-forgotten data is tracked with standard NLP scores.
    formula: null
    keys:
    - zhang2025does
    - dontsov2024clear
    - liu2024large
    - hessel2021clipscore
    - yang2024cliperase
    - cheng2024multidelete
    models: []
    why: []
  - id: fid
    name: FID
    description: To ensure image generation quality is retained, vision metrics like Fréchet Inception Distance (FID), Fréchet
      Video Distance (FVD), Kernel Inception Distance (KID) and inverted FID (IFID) are commonly reported.
    formula: \begin{aligned} \mathrm{FID}(r,g) &= \lVert \mu_r - \mu_g \rVert_2^2 \\ &\quad + \operatorname{Tr}\!\big( \Sigma_r
      + \Sigma_g - 2(\Sigma_r \Sigma_g)^{1/2} \big). \end{aligned}
    keys:
    - heusel2017gans
    - unterthiner2019fvd
    - facchiano2025video
    - binkowski2018demystifying
    - li2024get
    - fan2023salun
    - zhang2024unlearncanvas
    - chen2025score
    - kirstain2023pick
    - schuhmann2022laion
    - li2023evaluating
    - ma2024benchmarking
    - li2024single
    models:
    - image-diffusion
    - video
    why:
    - To ensure image generation quality is retained
    - Fréchet Video Distance (FVD)
  - id: lpips
    name: LPIPS
    description: Perceptual similarity metrics assess whether unlearning alters model outputs on benign inputs by comparing
      generations from the unlearned model to those of the original model.
    formula: null
    keys:
    - zhang2018unreasonable
    - dai2023training
    - park2024direct
    - biswas2025cure
    models:
    - image-diffusion
    why:
    - comparing generations from the unlearned model to those of the original model
  - id: llm-as-a-judge
    name: LLM-as-a-Judge
    description: Several multimodal unlearning studies use large language models as semantic evaluators to score model outputs.
    formula: null
    keys:
    - ma2024benchmarking
    - park2024direct
    - xu2025pebench
    - liu2025protecting
    models: []
    why: []
  - id: human-as-judge
    name: Human-as-Judge
    description: While most unlearning work relies on automatic metrics, several multimodal studies incorporate human judgment
      to assess perceived safety and fidelity.
    formula: null
    keys:
    - chakraborty2024can
    - huang2024freezeasguard
    models: []
    why: []

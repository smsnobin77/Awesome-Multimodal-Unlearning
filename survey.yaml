families:
- id: data-path
  stage: data-side
  name: Data-path perturbation
  methods:
  - name: UCs
    key: zhang2023unlearnable
  - name: MEM
    key: liu2024multimodal
  - name: UnSeg
    key: sun2024unseg
  - name: MetaCloak
    key: liu2024metacloak
  mechanism: Data-path perturbation unlearning edits inputs, not weights, to reduce the learnability of targeted clusters,
    pairs, or subjects while preserving utility on the remaining corpus.
  formula: \|p_{\mathrm{img}}(x)\| \le \epsilon_{\mathrm{img}},\quad \|p_{\mathrm{txt}}(t)\| \le \epsilon_{\mathrm{txt}},\quad
    p \in \Pi_{T},
  keys:
  - zhang2023unlearnable
  - liu2024multimodal
  - sun2024unseg
  - liu2024metacloak
- id: data-hygiene
  stage: data-side
  name: Data hygiene and prompt normalization
  methods:
  - name: CleanCLIP
    key: bansal2023cleanclip
  - name: Homoglyph Bias
    key: struppek2024exploiting
  mechanism: Data hygiene reduces backdoor and trigger effects by curating or down-weighting suspicious image-text pairs,
    while prompt normalization canonicalizes visually or lexically similar tokens prior to optimization.
  formula: w(x,t)\in[0,1], \qquad t \mapsto N(t),
  keys:
  - bansal2023cleanclip
  - struppek2024exploiting
- id: direct-gradient
  stage: training-time
  name: Direct gradient
  methods:
  - name: MultiDelete
    key: cheng2024multidelete
  - name: Unlearn Backdoors
    key: liang2024unlearning
  - name: SIU
    key: li2024single
  - name: EFUF
    key: xing2024efuf
  - name: NCU
    key: han2025unlearning
  mechanism: Direct gradient methods formulate unlearning as targeted risk minimization over a retain set and a forget set.
  formula: \begin{aligned} J(\theta) =\;& \mathbb{E}_{(x_r,y_r)\in R}\,\mathcal{L}_u(f_\theta(x_r),y_r) \\ &+ \alpha\,\mathbb{E}_{(x_f,y_f)\in
    F}\,\mathcal{L}_f(f_\theta(x_f),y_f) \\ &+ \beta\,\mathbb{E}_{x_f\in F}\,D_a(f_\theta,x_f;a) \\ &+ \gamma\,\Omega(\theta,\theta_0),
    \end{aligned}
  keys:
  - bansal2023cleanclip
  - cheng2024multidelete
  - park2024direct
  - kumari2023ablating
  - li2024safegen
  - liu2024unlearning
  - spartalis2025unleashing
  - kim2025not
  - liu2025unlearning
  - pathak2025quantum
  - kim2025no
- id: constrained
  stage: training-time
  name: Constrained updates
  methods:
  - name: Boosting Alignment
    key: ko2024boosting
  - name: MUNBa
    key: wu2025munba
  - name: Controllable Unlearning
    key: fengcontrollable2025
  - name: LoReUn
    key: li2025loreun
  mechanism: Constrained update methods retain the locate-then-unlearn workflow but make the trade-off between forgetting
    and retention explicit.
  formula: \begin{aligned} \min_{\theta}\quad & \underbrace{\mathcal{J}_R(\theta)}_{\text{retain risk}} \;+\; \underbrace{\Omega(\theta,\theta_0)}_{\text{stability}}
    \\[2pt] \text{s.t.}\quad & \underbrace{\mathcal{C}_f(\theta)}_{\text{forget efficacy}} \le 0,\qquad \underbrace{\mathcal{C}_i(\theta)}_{\text{integrity}}
    \le 0 \end{aligned}
  keys:
  - schioppa2024model
  - wu2025munba
  - fengcontrollable2025
  - ko2024boosting
  - alberti2025data
  - sinha2025multi
  - li2025loreun
- id: mask-driven
  stage: training-time
  name: Mask-driven selective unlearning
  methods:
  - name: SalUn
    key: fan2023salun
  - name: Forget-Me-Not
    key: zhang2024forget
  - name: MMUnlearner
    key: huo2025mmunlearner
  - name: SAU
    key: jha2025backdoor
  - name: KSCU
    key: zhang2025concept
  mechanism: Mask-driven methods follow the locate-then-unlearn workflow but constrain updates to a localized support identified
    through saliency, attention, or architectural structure.
  formula: null
  keys:
  - fan2023salun
  - huo2025mmunlearner
  - zhang2024forget
  - jha2025backdoor
  - zhang2025concept
  - li2025sculpting
- id: distillation
  stage: training-time
  name: Distillation-based
  methods:
  - name: SSD
    key: kim2023towards
  - name: SFD
    key: chen2025score
  - name: SKD-CAG
    key: aravindan2025sealing
  mechanism: Distillation-based unlearning follows the locate-then-unlearn paradigm by transferring behavior through a teacher-student
    setup, where the student is guided toward a safe target while retaining competence on non-forgotten prompts.
  formula: null
  keys:
  - kim2023towards
  - chen2025score
  - aravindan2025sealing
- id: architecture-editing
  stage: architecture
  name: Architecture editing
  methods:
  - name: FreezeAsGuard
    key: huang2024freezeasguard
  - name: Efficient Fine-Tuning
    key: shirkavand2025efficient
  - name: MANU
    key: liu2025modality
  - name: Audio Unlearning
    key: mason-williams2025machine
  mechanism: Architecture editing methods follow the locate-then-unlearn paradigm by modifying network structure through pruning,
    freezing, or controlled regrowth.
  formula: null
  keys:
  - liu2025modality
  - shirkavand2025efficient
  - huang2024freezeasguard
  - mason-williams2025machine
- id: layer-scoped
  stage: architecture
  name: Layer-scoped constrained updates
  methods:
  - name: Model Integrity
    key: schioppa2024model
  - name: SLUG
    key: caitargeted2025
  mechanism: Layer-scoped constrained updates follow locate-then-unlearn by first identifying where the target concept concentrates,
    then restricting edits to that support to limit collateral damage.
  formula: null
  keys:
  - caitargeted2025
  - schioppa2024model
- id: weight-space
  stage: training-free
  name: Weight-space linear unlearning
  methods:
  - name: Task Arithmetic
    key: ilharcoediting2023
  - name: NegMerge
    key: kim2024negmerge
  - name: Diffusion Soup
    key: biggs2024diffusion
  - name: Video Unlearning
    key: facchiano2025video
  mechanism: Weight-space Linear Unlearning (WLU) follows the locate-then-unlearn paradigm but replaces iterative optimization
    with closed-form edits in parameter space.
  formula: null
  keys:
  - ilharcoediting2023
  - kim2024negmerge
  - facchiano2025video
  - biggs2024diffusion
- id: representation-projection
  stage: training-free
  name: Representation projection
  methods:
  - name: Safe-CLIP
    key: poppi2023removing
  - name: CURE
    key: biswas2025cure
  - name: Motion Unlearning
    key: de2025human
  mechanism: Representation Projection Unlearning (RPU) follows the locate-then-unlearn paradigm but replaces iterative optimization
    with closed-form edits in representation space.
  formula: h' \;=\; (I - U U^{\top})\,h, \qquad W' \;=\; W\,(I - U U^{\top}),
  keys:
  - biswas2025cure
  - poppi2023removing
  - de2025human
- id: guidance-path
  stage: decoding-time
  name: Guidance-path control
  methods:
  - name: UnGuide
    key: polowczyk2025unguide
  - name: SAFREE
    key: yoon2025safree
  - name: DNG
    key: koulischer2025dynamic
  - name: Detect-and-Guide
    key: li2025detect
  mechanism: Guidance-path control performs locate-then-unlearn at decoding time by modifying the sampler rather than the
    model parameters.
  formula: \hat{\epsilon}_t = \epsilon_\theta(x_t,c) + a_t\bigl[\epsilon_{\mathrm{alt}}(x_t,c)-\epsilon_\theta(x_t,c)\bigr]
    - b_t\, M_t\, d_t,
  keys:
  - koulischer2025dynamic
  - polowczyk2025unguide
  - park2025steering
  - li2025detect
  - yoon2025safree
- id: conditioning-path
  stage: decoding-time
  name: Conditioning-path control
  methods:
  - name: SteerDiff
    key: zhang2024steerdiff
  - name: CPR
    key: golatkar2024cpr
  - name: Moderator
    key: wang2024moderator
  - name: SuppressEOT
    key: li2024get
  mechanism: Conditioning-path control performs locate-then-unlearn by modifying the conditioning signal that guides generation,
    while leaving model parameters unchanged.
  formula: c' \;=\; (1 - \alpha)\,c \;+\; \alpha\, T(c, R, \text{policy}),
  keys:
  - zhang2024steerdiff
  - li2024get
  - wang2024moderator
  - golatkar2024cpr
  - bui2025hiding

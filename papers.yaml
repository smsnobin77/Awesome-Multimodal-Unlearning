- key: neel2021descent
  name: null
  title: 'Descent-to-delete: Gradient-based methods for machine unlearning'
  authors:
  - Seth Neel
  - Aaron Roth
  - Saeed Sharifi-Malvajerdi
  year: 2021
  date: 2020-07
  venue: Algorithmic Learning Theory
  peer_reviewed: true
  kind: analysis
  stage: null
  family: null

  abstract: Although Multimodal Large Language Models (MLLMs) have advanced numerous fields, their training on extensive multimodal
    datasets introduces significant privacy concerns, prompting the necessity for effective unlearning methods. However, current
    multimodal unlearning approaches often directly adapt techniques from unimodal contexts, largely overlooking the critical
    issue of modality alignment, i.e., consistently removing knowledge across both unimodal and multimodal settings. To close
    this gap, we introduce UMU-Bench , a unified benchmark specifically targeting modality misalignment in multimodal unlearning.
    UMU-Bench consists of a meticulously curated dataset featuring 653 individual profiles, each described with both unimodal
    and multimodal knowledge. Additionally, novel tasks and evaluation metrics focusing on modality alignment are introduced,
    facilitating a comprehensive analysis of unimodal and multimodal unlearning effectiveness. Through extensive experimentation
    with state-of-the-art unlearning algorithms on UMU-Bench , we demonstrate prevalent modality misalignment issues in existing
    methods. These findings underscore the critical need for novel multimodal unlearning approaches explicitly considering
    modality alignment. The code and data are publicly available at https://github.com/QDRhhhh/UMU-bench .

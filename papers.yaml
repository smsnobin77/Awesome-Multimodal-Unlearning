- key: blanco2025digital
  name: null
  title: 'Digital forgetting in large language models: A survey of unlearning methods'
  authors:
  - Alberto Blanco-Justicia
  - Najeeb Jebreel
  - Benet Manzanares-Salor
  - David Sánchez
  - Josep Domingo-Ferrer

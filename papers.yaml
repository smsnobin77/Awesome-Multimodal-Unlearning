    arxiv: https://arxiv.org/abs/2506.02541
  abstract: 'Large Vision-Language Models (LVLMs) can recognize individuals in images and disclose sensitive personal information
    about them, raising critical privacy concerns. Machine unlearning aims to remove such knowledge from the model. However,
    existing methods rarely prescribe what the model should output in place of the forgotten content, leading to Unlearning
    Aftermaths: degenerate, hallucinated, or excessively refused responses. We argue that, especially for generative LVLMs,
    it is crucial to consider the quality and informativeness of post-unlearning responses rather than relying solely on naive
    suppression. To address this, we introduce a new unlearning task for LVLMs that requires models to provide privacy-preserving
    yet informative and visually grounded responses. We also propose PUBG, a novel unlearning method that explicitly guides
    post-unlearning behavior toward a desirable output distribution. Experiments show that, while existing methods suffer
    from Unlearning Aftermaths despite successfully preventing privacy violations, PUBG effectively mitigates these issues,
    generating visually grounded and informative responses without privacy leakage for forgotten targets.'

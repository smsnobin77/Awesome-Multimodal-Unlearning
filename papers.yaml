  in_survey: true
  links:
    arxiv: https://arxiv.org/abs/2407.16307
  abstract: Multimodal contrastive learning (MCL) has shown remarkable advances in zero-shot classification by learning from
    millions of image-caption pairs crawled from the Internet. However, this reliance poses privacy risks, as hackers may
    unauthorizedly exploit image-text data for model training, potentially including personal and privacy-sensitive information.
    Recent works propose generating unlearnable examples by adding imperceptible perturbations to training images to build
    shortcuts for protection. However, they are designed for unimodal classification, which remains largely unexplored in
    MCL. We first explore this context by evaluating the performance of existing methods on image-caption pairs, and they
    do not generalize effectively to multimodal data and exhibit limited impact to build shortcuts due to the lack of labels
    and the dispersion of pairs in MCL. In this paper, we propose Multi-step Error Minimization (MEM), a novel optimization
    process for generating multimodal unlearnable examples. It extends the Error-Minimization (EM) framework to optimize both
    image noise and an additional text trigger, thereby enlarging the optimized space and effectively misleading the model
    to learn the shortcut between the noise features and the text trigger. Specifically, we adopt projected gradient descent
    to solve the noise minimization problem and use HotFlip to approximate the gradient and replace words to find the optimal
    text trigger. Extensive experiments demonstrate the effectiveness of MEM, with post-protection retrieval results nearly
    half of random guessing, and its high transferability across different models. Our code is available on the https://github.com/thinwayliu/Multimodal-Unlearnable-Examples
  bibtex: |-
    @inproceedings{liu2024multimodal,
      title={Multimodal unlearnable examples: Protecting data against multimodal contrastive learning},
      author={Liu, Xinwei and Jia, Xiaojun and Xun, Yuan and Liang, Siyuan and Cao, Xiaochun},
      booktitle={Proceedings of the 32nd ACM International Conference on Multimedia},
      year={2024}
    }
- key: sun2024unseg
  name: UnSeg
  title: 'UnSeg: One Universal Unlearnable Example Generator is Enough against All Image Segmentation'
  authors:
  - Ye Sun
  - Hao Zhang
  - Tiehua Zhang
  - Xingjun Ma
  - Yu-Gang Jiang
  year: 2024
  date: 2024-10
  venue: NeurIPS
  peer_reviewed: true
  kind: method
  stage: data-side
  family: data-path
  tags:
    application:
    - privacy
  added: {}
  in_survey: true
  links:
    arxiv: https://arxiv.org/abs/2410.09909
  abstract: Image segmentation is a crucial vision task that groups pixels within an image into semantically meaningful segments,
    which is pivotal in obtaining a fine-grained understanding of real-world scenes. However, an increasing privacy concern
    exists regarding training large-scale image segmentation models on unauthorized private data. In this work, we exploit
    the concept of unlearnable examples to make images unusable to model training by generating and adding unlearnable noise
    into the original images. Particularly, we propose a novel Unlearnable Segmentation (UnSeg) framework to train a universal
    unlearnable noise generator that is capable of transforming any downstream images into their unlearnable version. The
    unlearnable noise generator is finetuned from the Segment Anything Model (SAM) via bilevel optimization on an interactive
    segmentation dataset towards minimizing the training error of a surrogate model that shares the same architecture with
    SAM but is trained from scratch. We empirically verify the effectiveness of UnSeg across 6 mainstream image segmentation
    tasks, 10 widely used datasets, and 7 different network architectures, and show that the unlearnable images can reduce
    the segmentation performance by a large margin. Our work provides useful insights into how to leverage foundation models
    in a data-efficient and computationally affordable manner to protect images against image segmentation models.
  bibtex: |-
    @inproceedings{sun2024unseg,
      title={UnSeg: one universal unlearnable example generator is enough against all image segmentation},
      author={Sun, Ye and Zhang, Hao and Zhang, Tiehua and Ma, Xingjun and Jiang, Yu-Gang},
      booktitle={Proceedings of the 38th International Conference on Neural Information Processing Systems},
      year={2024}
    }
- key: zhang2023unlearnable
  name: UCs
  title: 'Unlearnable Clusters: Towards Label-agnostic Unlearnable Examples'
  authors:
  - Jiaming Zhang
  - Xingjun Ma
  - Qi Yi
  - Jitao Sang
  - Yu-Gang Jiang
  - Yaowei Wang
  - Changsheng Xu

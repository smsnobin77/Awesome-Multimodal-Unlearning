- key: struppek2024exploiting
  name: Homoglyph Bias
  title: Exploiting Cultural Biases via Homoglyphs in Text-to-Image Synthesis
  authors:
  - Lukas Struppek
  - Dominik Hintersdorf
  - Felix Friedrich
  - Manuel Brack
  - Patrick Schramowski
  - Kristian Kersting
  year: 2024
  date: 2022-09
  venue: IJCAI
  peer_reviewed: true
  kind: method
  stage: data-side
  family: data-hygiene
  tags:
    application:
    - fairness
    metric:
    - top-k-acc
  added:
    model:
    - image-diffusion
  in_survey: true
  links:
    paper: https://arxiv.org/pdf/2209.08891
    arxiv: https://arxiv.org/abs/2209.08891
  abstract: Models for text-to-image synthesis, such as DALL-E 2 and Stable Diffusion, have recently drawn a lot of interest
    from academia and the general public. These models are capable of producing high-quality images that depict a variety
    of concepts and styles when conditioned on textual descriptions. However, these models adopt cultural characteristics
    associated with specific Unicode scripts from their vast amount of training data, which may not be immediately apparent.
    We show that by simply inserting single non-Latin characters in the textual description, common models reflect cultural
    biases in their generated images. We analyze this behavior both qualitatively and quantitatively and identify a model’s
    text encoder as the root cause of the phenomenon. Such behavior can be interpreted as a model feature, offering users
    a simple way to customize the image generation and reflect their own cultural background. Yet, malicious users or service
    providers may also try to intentionally bias the image generation. One goal might be to create racist stereotypes by replacing
    Latin characters with similarly-looking characters from non-Latin scripts, so-called homoglyphs. To mitigate such unnoticed
    script attacks, we propose a novel homoglyph unlearning method to fine-tune a text encoder, making it robust against homoglyph
    manipulations.
  bibtex: |-
    @inproceedings{struppek2024exploiting,
      title={Exploiting cultural biases via homoglyphs intext-to-image synthesis},
      author={Struppek, Lukas and Hintersdorf, Dominik and Friedrich, Felix and Brack, Manuel and Schramowski, Patrick and Kersting, Kristian},
      booktitle={Proceedings of the Thirty-Third International Joint Conference on Artificial Intelligence},
      year={2024}
    }
- key: bansal2023cleanclip
  name: CleanCLIP
  title: 'CleanCLIP: Mitigating Data Poisoning Attacks in Multimodal Contrastive Learning'
  authors:
  - Hritik Bansal
  - Nishad Singhi
  - Yu Yang
  - Fan Yin
  - Aditya Grover
  - Kai-Wei Chang
  year: 2023
  date: 2023-03

- key: gandikota2023erasing
  name: null
  title: Erasing concepts from diffusion models
  authors:
  - Rohit Gandikota
  - Joanna Materzynska
  - Jaden Fiotto-Kaufman
  - David Bau
  year: 2023
  date: 2023-03

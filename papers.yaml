  abstract: The rapid advancement of Zero-Shot Text-to-Speech (ZS-TTS) technology has enabled high-fidelity voice synthesis
    from minimal audio cues, raising significant privacy and ethical concerns. Despite the threats to voice privacy, research
    to selectively remove the knowledge to replicate unwanted individual voices from pre-trained model parameters has not
    been explored. In this paper, we address the new challenge of speaker identity unlearning for ZS-TTS systems. To meet
    this goal, we propose the first machine unlearning frameworks for ZS-TTS, especially Teacher-Guided Unlearning (TGU),
    designed to ensure the model forgets designated speaker identities while retaining its ability to generate accurate speech
    for other speakers. Our proposed methods incorporate randomness to prevent consistent replication of forget speakers'
    voices, assuring unlearned identities remain untraceable. Additionally, we propose a new evaluation metric, speaker-Zero
    Retrain Forgetting (spk-ZRF). This assesses the model's ability to disregard prompts associated with forgotten speakers,
    effectively neutralizing its knowledge of these voices. The experiments conducted on the state-of-the-art model demonstrate
    that TGU prevents the model from replicating forget speakers' voices while maintaining high quality for other speakers.
    The demo is available at https://speechunlearn.github.io/

  abstract: Diffusion models (DMs) have demonstrated remarkable proficiency in producing images based on textual prompts.
    Numerous methods have been proposed to ensure these models generate safe images. Early methods attempt to incorporate
    safety filters into models to mitigate the risk of generating harmful images but such exter-nal filters do not inherently
    detoxify the model and can be easily bypassed. Hence, model unlearning and data cleaning are the most essential methods
    for maintaining the safety of models, given their impact on model parameters. However, malicious fine-tuning can still
    make models prone to generating harmful or undesirable images even with these methods. Inspired by the phenomenon of catastrophic
    forgetting, we propose a training policy using contrastive learning to increase the latent space distance between clean
    and harmful data distribution, thereby protecting models from being fine-tuned to generate harmful images due to forgetting.
    The experimental results demonstrate that our methods not only maintain clean image generation capabilities before malicious
    fine-tuning but also effectively prevent DMs from producing harmful images after malicious fine-tuning. Our method can
    also be combined with other safety methods to maintain their safety against malicious fine-tuning further.

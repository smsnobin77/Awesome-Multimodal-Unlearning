  abstract: Recent advances in Large Language Models (LLMs) have been extended to the field of Automatic Speech Recognition
    (ASR), leveraging the exceptional generative capabilities of LLMs for speech transcription generation. However, concerns
    about privacy risks have emerged since both LLMs and large ASR models may unintentionally memorize training examples.
    After deploying a model, practitioners might be asked to remove any personal data from the model. Re-training the original

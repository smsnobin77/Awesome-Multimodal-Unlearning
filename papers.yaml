    - knowledge
  in_survey: true
  links:
    arxiv: https://arxiv.org/abs/2311.15766
  abstract: 'In recent years, large language models (LLMs) have spurred a new research paradigm in natural language processing.
    Despite their excellent capability in knowledge-based question answering and reasoning, their potential to retain faulty
    or even harmful knowledge poses risks of malicious application. The challenge of mitigating this issue and transforming
    these models into purer assistants is crucial for their widespread applicability. Unfortunately, Retraining LLMs repeatedly
    to eliminate undesirable knowledge is impractical due to their immense parameters. Knowledge unlearning, derived from
    analogous studies on machine unlearning, presents a promising avenue to address this concern and is notably advantageous
    in the context of LLMs. It allows for the removal of harmful knowledge in an efficient manner, without affecting unrelated
    knowledge in the model. To this end, we provide a survey of knowledge unlearning in the era of LLMs. Firstly, we formally
    define the knowledge unlearning problem and distinguish it from related works. Subsequently, we categorize existing knowledge
    unlearning methods into three classes: those based on parameter optimization, parameter merging, and in-context learning,
    and introduce details of these unlearning methods. We further present evaluation datasets used in existing methods, and
    finally conclude this survey by presenting the ongoing challenges and future directions.'
  bibtex: |-
    @article{si2023knowledge,
      title={Knowledge unlearning for llms: Tasks, methods, and challenges},
      author={Si, Nianwen and Zhang, Hao and Chang, Heyu and Zhang, Wenlin and Qu, Dan and Zhang, Weiqiang},
      journal={arXiv preprint arXiv:2311.15766},
      year={2023}
    }
- key: jia2023model
  name: null
  title: Model sparsity can simplify machine unlearning
  authors:
  - Jinghan Jia
  - Jiancheng Liu
  - Parikshit Ram
  - Yuguang Yao
  - Gaowen Liu
  - Yang Liu
  - Pranay Sharma
  - Sijia Liu
  year: 2023
  date: 2023-04
  venue: NeurIPS
  peer_reviewed: true
  kind: analysis
  stage: null
  family: null
  tags:
    metric:
    - mia
  added: {}
  in_survey: true
  links:
    arxiv: https://arxiv.org/abs/2304.04934
  abstract: 'In response to recent data regulation requirements, machine unlearning (MU) has emerged as a critical process
    to remove the influence of specific examples from a given model. Although exact unlearning can be achieved through complete
    model retraining using the remaining dataset, the associated computational costs have driven the development of efficient,
    approximate unlearning techniques. Moving beyond data-centric MU approaches, our study introduces a novel model-based
    perspective: model sparsification via weight pruning, which is capable of reducing the gap between exact unlearning and
    approximate unlearning. We show in both theory and practice that model sparsity can boost the multi-criteria unlearning
    performance of an approximate unlearner, closing the approximation gap, while continuing to be efficient. This leads to
    a new MU paradigm, termed prune first, then unlearn, which infuses a sparse model prior into the unlearning process. Building
    on this insight, we also develop a sparsity-aware unlearning method that utilizes sparsity regularization to enhance the
    training process of approximate unlearning. Extensive experiments show that our proposals consistently benefit MU in various
    unlearning scenarios. A notable highlight is the 77% unlearning efficacy gain of fine-tuning (one of the simplest unlearning
    methods) when using sparsity-aware unlearning. Furthermore, we demonstrate the practical impact of our proposed MU methods
    in addressing other machine learning challenges, such as defending against backdoor attacks and enhancing transfer learning.
    Codes are available at https://github.com/OPTML-Group/Unlearn-Sparse.'
  bibtex: |-
    @article{jia2023model,
      title={Model sparsity can simplify machine unlearning},
      author={Jia, Jinghan and Liu, Jiancheng and Ram, Parikshit and Yao, Yuguang and Liu, Gaowen and Liu, Yang and Sharma, Pranay and Liu, Sijia},
      journal={Advances in Neural Information Processing Systems},
      year={2023}
    }

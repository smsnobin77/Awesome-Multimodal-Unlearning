      year={2019}
    }
- key: cao2015towards
  name: null
  title: Towards making systems forget with machine unlearning
  authors:
  - Yinzhi Cao
  - Junfeng Yang
  year: 2015
  date: null
  venue: IEEE S&P
  peer_reviewed: true
  kind: analysis
  stage: null
  family: null
  tags: {}
  added: {}
  in_survey: true
  links:
    paper: https://doi.org/10.1109/sp.2015.35
  abstract: Today's systems produce a rapidly exploding amount of data, and the data further derives more data, forming a
    complex data propagation network that we call the data's lineage. There are many reasons that users want systems to forget
    certain data including its lineage. From a privacy perspective, users who become concerned with new privacy risks of a
    system often want the system to forget their data and lineage. From a security perspective, if an attacker pollutes an
    anomaly detector by injecting manually crafted data into the training data set, the detector must forget the injected
    data to regain security. From a usability perspective, a user can remove noise and incorrect entries so that a recommendation
    engine gives useful recommendations. Therefore, we envision forgetting systems, capable of forgetting certain data and
    their lineages, completely and quickly. This paper focuses on making learning systems forget, the process of which we
    call machine unlearning, or simply unlearning. We present a general, efficient unlearning approach by transforming learning
    algorithms used by a system into a summation form. To forget a training data sample, our approach simply updates a small
    number of summations -- asymptotically faster than retraining from scratch. Our approach is general, because the summation
    form is from the statistical query learning in which many machine learning algorithms can be implemented. Our approach
    also applies to all stages of machine learning, including feature selection and modeling. Our evaluation, on four diverse
    learning systems and real-world workloads, shows that our approach is general, effective, fast, and easy to use.
  bibtex: |-
    @inproceedings{cao2015towards,
      title={Towards making systems forget with machine unlearning},
      author={Cao, Yinzhi and Yang, Junfeng},
      booktitle={2015 IEEE symposium on security and privacy},
      year={2015}
    }

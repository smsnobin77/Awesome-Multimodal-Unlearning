- key: bourtoule2021machine
  name: null
  title: Machine unlearning
  authors:
  - Lucas Bourtoule
  - Varun Chandrasekaran
  - Christopher A Choquette-Choo
  - Hengrui Jia
  - Adelin Travers
  - Baiwu Zhang
  - David Lie
  - Nicolas Papernot
  year: 2021
  date: 2019-12
  venue: IEEE S&P
  peer_reviewed: true
  kind: analysis
  stage: null
  family: null
  tags: {}
  added: {}
  in_survey: true
  links:
    arxiv: https://arxiv.org/abs/1912.03817
  abstract: Once users have shared their data online, it is generally difficult for them to revoke access and ask for the
    data to be deleted. Machine learning (ML) exacerbates this problem because any model trained with said data may have memorized
    it, putting users at risk of a successful privacy attack exposing their information. Yet, having models unlearn is notoriously
    difficult. We introduce SISA training, a framework that expedites the unlearning process by strategically limiting the
    influence of a data point in the training procedure. While our framework is applicable to any learning algorithm, it is
    designed to achieve the largest improvements for stateful algorithms like stochastic gradient descent for deep neural
    networks. SISA training reduces the computational overhead associated with unlearning, even in the worst-case setting
    where unlearning requests are made uniformly across the training set. In some cases, the service provider may have a prior
    on the distribution of unlearning requests that will be issued by users. We may take this prior into account to partition
    and order data accordingly, and further decrease overhead from unlearning. Our evaluation spans several datasets from
    different domains, with corresponding motivations for unlearning. Under no distributional assumptions, for simple learning
    tasks, we observe that SISA training improves time to unlearn points from the Purchase dataset by 4.63x, and 2.45x for
    the SVHN dataset, over retraining from scratch. SISA training also provides a speed-up of 1.36x in retraining for complex
    learning tasks such as ImageNet classification; aided by transfer learning, this results in a small degradation in accuracy.
    Our work contributes to practical data governance in machine unlearning.
  bibtex: |-
    @inproceedings{bourtoule2021machine,
      title={Machine unlearning},
      author={Bourtoule, Lucas and Chandrasekaran, Varun and Choquette-Choo, Christopher A and Jia, Hengrui and Travers, Adelin and Zhang, Baiwu and Lie, David and Papernot, Nicolas},
      booktitle={2021 IEEE Symposium on Security and Privacy (SP)},
      year={2021}
    }
- key: sekhari2021remember
  name: null
  title: 'Remember what you want to forget: Algorithms for machine unlearning'
  authors:
  - Ayush Sekhari
  - Jayadev Acharya
  - Gautam Kamath
  - Ananda Theertha Suresh
  year: 2021
  date: 2021-03
  venue: NeurIPS
  peer_reviewed: true
  kind: analysis
  stage: null
  family: null
  tags: {}
  added: {}
  in_survey: true
  links:
    arxiv: https://arxiv.org/abs/2103.03279
  abstract: We study the problem of unlearning datapoints from a learnt model. The learner first receives a dataset $S$ drawn
    i.i.d. from an unknown distribution, and outputs a model $\widehat{w}$ that performs well on unseen samples from the same
    distribution. However, at some point in the future, any training datapoint $z \in S$ can request to be unlearned, thus
    prompting the learner to modify its output model while still ensuring the same accuracy guarantees. We initiate a rigorous
    study of generalization in machine unlearning, where the goal is to perform well on previously unseen datapoints. Our
    focus is on both computational and storage complexity. For the setting of convex losses, we provide an unlearning algorithm
    that can unlearn up to $O(n/d^{1/4})$ samples, where $d$ is the problem dimension. In comparison, in general, differentially
    private learning (which implies unlearning) only guarantees deletion of $O(n/d^{1/2})$ samples. This demonstrates a novel
    separation between differential privacy and machine unlearning.
  bibtex: |-
    @article{sekhari2021remember,
      title={Remember what you want to forget: Algorithms for machine unlearning},
      author={Sekhari, Ayush and Acharya, Jayadev and Kamath, Gautam and Suresh, Ananda Theertha},
      journal={Advances in Neural Information Processing Systems},
      year={2021}
    }
- key: guo2020certified

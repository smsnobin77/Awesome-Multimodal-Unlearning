  abstract: 'User data spread across multiple modalities has popularized multi-modal recommender systems (MMRS). They recommend
    diverse content such as products, social media posts, TikTok reels, etc., based on a user-item interaction graph. With
    rising data privacy demands, recent methods propose unlearning private user data from uni-modal recommender systems (RS).
    However, methods for unlearning item data related to outdated user preferences, revoked licenses, and legally requested
    removals are still largely unexplored. Previous RS unlearning methods are unsuitable for MMRS due to the incompatibility
    of their matrix-based representation with the multi-modal user-item interaction graph. Moreover, their data partitioning
    step degrades performance on each shard due to poor data heterogeneity and requires costly performance aggregation across
    shards. This paper introduces MMRecUn, the first approach known to us for unlearning in MMRS and unlearning item data.
    Given a trained RS model, MMRecUn employs a novel Reverse Bayesian Personalized Ranking (BPR) objective to enable the
    model to forget marked data. The reverse BPR attenuates the impact of user-item interactions within the forget set, while
    the forward BPR reinforces the significance of user-item interactions within the retain set. Our experiments demonstrate
    that MMRecUn outperforms baseline methods across various unlearning requests when evaluated on benchmark MMRS datasets.
    MMRecUn achieves recall performance improvements of up to 49.85% compared to baseline methods and is up to 1.3x faster
    than the Gold model, which is trained on retain set from scratch. MMRecUn offers significant advantages, including superiority
    in removing target interactions, preserving retained interactions, and zero overhead costs compared to previous methods.
    Code: https://github.com/MachineUnlearn/MMRecUN Extended version: arXiv:2405.15328'
  bibtex: |-
    @inproceedings{sinha2025multi,
      title={Multi-Modal Recommendation Unlearning for Legal, Licensing, and Modality Constraints},
      author={Sinha, Yash and Mandal, Murari and Kankanhalli, Mohan},
      booktitle={Proceedings of the AAAI Conference on Artificial Intelligence},
      year={2025}
    }
- key: wu2025munba
  name: MUNBa
  title: 'MUNBa: Machine Unlearning via Nash Bargaining'
  authors:
  - Jing Wu
  - Mehrtash Harandi
  year: 2025
  date: 2024-11
  venue: ICCV
  peer_reviewed: true
  kind: method
  stage: training-time
  family: constrained
  tags:

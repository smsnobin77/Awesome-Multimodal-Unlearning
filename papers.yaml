  abstract: Text-to-image (T2I) models, such as Stable Diffusion, have exhibited remarkable performance in generating high-quality
    images from text descriptions in recent years. However, text-to-image models may be tricked into generating not-safe-for-work
    (NSFW) content, particularly in sexually explicit scenarios. Existing countermeasures mostly focus on filtering inappropriate
    inputs and outputs, or suppressing improper text embeddings, which can block sexually explicit content (e.g., naked) but
    may still be vulnerable to adversarial prompts-inputs that appear innocent but are ill-intended. In this paper, we present
    SafeGen, a framework to mitigate sexual content generation by text-to-image models in a text-agnostic manner. The key
    idea is to eliminate explicit visual representations from the model regardless of the text input. In this way, the text-to-image
    model is resistant to adversarial prompts since such unsafe visual representations are obstructed from within. Extensive
    experiments conducted on four datasets and large-scale user studies demonstrate SafeGen's effectiveness in mitigating
    sexually explicit content generation while preserving the high-fidelity of benign images. SafeGen outperforms eight state-of-the-art
    baseline methods and achieves 99.4% sexual content removal performance.

  abstract: Multimodal large language models (MLLMs) have achieved remarkable success in vision-language tasks, but their
    reliance on vast, internet-sourced data raises significant privacy and security concerns. Machine unlearning (MU) has
    emerged as a critical technique to address these issues, enabling the selective removal of targeted information from pre-trained
    models without costly retraining. However, the evaluation of MU for MLLMs remains inadequate. Existing benchmarks often
    lack a comprehensive scope, focusing narrowly on entities while overlooking the unlearning of broader visual concepts
    and the inherent semantic coupling between them. To bridge this gap, we introduce, PEBench, a novel benchmark designed
    to facilitate a thorough assessment of MU in MLLMs. PEBench features a fictitious dataset of personal entities and corresponding
    event scenes to evaluate unlearning across these distinct yet entangled concepts. We leverage this benchmark to evaluate
    five MU methods, revealing their unique strengths and weaknesses. Our findings show that unlearning one concept can unintentionally
    degrade performance on related concepts within the same image, a challenge we term cross-concept interference. Furthermore,
    we demonstrate the difficulty of unlearning person and event concepts simultaneously and propose an effective method to
    mitigate these conflicting objectives. The source code and benchmark are publicly available at https://pebench.github.io.

  in_survey: true
  links:
    arxiv: https://arxiv.org/abs/2303.03323
  abstract: Multimodal contrastive pretraining has been used to train multimodal representation models, such as CLIP, on large
    amounts of paired image-text data. However, previous studies have revealed that such models are vulnerable to backdoor
    attacks. Specifically, when trained on backdoored examples, CLIP learns spurious correlations between the embedded backdoor
    trigger and the target label, aligning their representations in the joint embedding space. Injecting even a small number
    of poisoned examples, such as 75 examples in 3 million pretraining data, can significantly manipulate the model's behavior,
    making it difficult to detect or unlearn such correlations. To address this issue, we propose CleanCLIP, a finetuning
    framework that weakens the learned spurious associations introduced by backdoor attacks by independently re-aligning the
    representations for individual modalities. We demonstrate that unsupervised finetuning using a combination of multimodal
    contrastive and unimodal self-supervised objectives for individual modalities can significantly reduce the impact of the
    backdoor attack. Additionally, we show that supervised finetuning on task-specific labeled image data removes the backdoor
    trigger from the CLIP vision encoder. We show empirically that CleanCLIP maintains model performance on benign examples
    while erasing a range of backdoor attacks on multimodal contrastive learning. The code and checkpoints are available at
    https://github.com/nishadsinghi/CleanCLIP.
  bibtex: |-
    @inproceedings{bansal2023cleanclip,
      title={Cleanclip: Mitigating data poisoning attacks in multimodal contrastive learning},
      author={Bansal, Hritik and Singhi, Nishad and Yang, Yu and Yin, Fan and Grover, Aditya and Chang, Kai-Wei},
      booktitle={Proceedings of the IEEE/CVF International Conference on Computer Vision},
      year={2023}
    }
- key: liu2024metacloak
  name: MetaCloak
  title: 'MetaCloak: Preventing Unauthorized Subject-driven Text-to-image Diffusion-based Synthesis via Meta-learning'
  authors:
  - Yixin Liu
  - Chenrui Fan
  - Yutong Dai
  - Xun Chen
  - Pan Zhou
  - Lichao Sun
  year: 2024
  date: 2023-11

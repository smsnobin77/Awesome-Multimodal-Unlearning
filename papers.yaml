  abstract: Machine unlearning is gaining increasing attention as a way to remove adversarial data poisoning attacks from
    already trained models and to comply with privacy and AI regulations. The objective is to unlearn the effect of undesired
    data from a trained model while maintaining performance on the remaining data. This paper introduces HyperForget, a novel
    machine unlearning framework that leverages hypernetworks - neural networks that generate parameters for other networks
    - to dynamically sample models that lack knowledge of targeted data while preserving essential capabilities. Leveraging
    diffusion models, we implement two Diffusion HyperForget Networks and used them to sample unlearned models in Proof-of-Concept
    experiments. The unlearned models obtained zero accuracy on the forget set, while preserving good accuracy on the retain

  abstract: State-of-the-art generative models exhibit powerful image-generation capabilities, introducing various ethical
    and legal challenges to service providers hosting these models. Consequently, Content Removal Techniques (CRTs) have emerged
    as a growing area of research to control outputs without full-scale retraining. Recent work has explored the use of Machine
    Unlearning in generative models to address content removal. However, the focus of such research has been on diffusion
    models, and unlearning in Generative Adversarial Networks (GANs) has remained largely unexplored. We address this gap
    by proposing Text-to-Unlearn, a novel framework that selectively unlearns concepts from pre-trained GANs using only text
    prompts, enabling feature unlearning, identity unlearning, and fine-grained tasks like expression and multi-attribute
    removal in models trained on human faces. Leveraging natural language descriptions, our approach guides the unlearning
    process without requiring additional datasets or supervised fine-tuning, offering a scalable and efficient solution. To
    evaluate its effectiveness, we introduce an automatic unlearning assessment method adapted from state-of-the-art image-text
    alignment metrics, providing a comprehensive analysis of the unlearning methodology. To our knowledge, Text-to-Unlearn
    is the first cross-modal unlearning framework for GANs, representing a flexible and efficient advancement in managing
    generative model behavior.

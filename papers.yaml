  abstract: 'Recent vision language models (VLMs) have made remarkable strides in generative modeling with multimodal inputs,
    particularly text and images. However, their susceptibility to generating harmful content when exposed to unsafe queries
    raises critical safety concerns. While current alignment strategies primarily rely on supervised safety fine-tuning with
    curated datasets, we identify a fundamental limitation we call the ''''safety mirage'''', where supervised fine-tuning
    inadvertently reinforces spurious correlations between superficial textual patterns and safety responses, rather than
    fostering deep, intrinsic mitigation of harm. We show that these spurious correlations leave fine-tuned VLMs vulnerable
    even to a simple one-word modification-based attack, where substituting a single word in text queries with a spurious
    correlation-inducing alternative can effectively bypass safeguards. Additionally, these correlations contribute to the
    over-prudence, causing fine-tuned VLMs to refuse benign queries unnecessarily. To address these issues, we show machine
    unlearning (MU) as a powerful alternative to supervised safety fine-tuning, as it avoids biased feature-label mappings
    and directly removes harmful knowledge from VLMs while preserving their general capabilities. Extensive evaluations across
    safety benchmarks show that under MU-based alignment reduces the attack success rate by up to 60.27% and cuts unnecessary
    rejections by over 84.20%. WARNING: There exist AI generations that may be offensive in nature.'

  in_survey: true
  links:
    arxiv: https://arxiv.org/abs/2311.13127
  abstract: 'Text-to-image diffusion models allow seamless generation of personalized images from scant reference photos.
    Yet, these tools, in the wrong hands, can fabricate misleading or harmful content, endangering individuals. To address
    this problem, existing poisoning-based approaches perturb user images in an imperceptible way to render them "unlearnable"
    from malicious uses. We identify two limitations of these defending approaches: i) sub-optimal due to the hand-crafted
    heuristics for solving the intractable bilevel optimization and ii) lack of robustness against simple data transformations
    like Gaussian filtering. To solve these challenges, we propose MetaCloak, which solves the bi-level poisoning problem
    with a meta-learning framework with an additional transformation sampling process to craft transferable and robust perturbation.
    Specifically, we employ a pool of surrogate diffusion models to craft transferable and model-agnostic perturbation. Furthermore,
    by incorporating an additional transformation process, we design a simple denoising-error maximization loss that is sufficient
    for causing transformation-robust semantic distortion and degradation in a personalized generation. Extensive experiments
    on the VGGFace2 and CelebA-HQ datasets show that MetaCloak outperforms existing approaches. Notably, MetaCloak can successfully
    fool online training services like Replicate, in a black-box manner, demonstrating the effectiveness of MetaCloak in real-world
    scenarios. Our code is available at https://github.com/liuyixin-louis/MetaCloak.'
  bibtex: |-
    @inproceedings{liu2024metacloak,
      title={Metacloak: Preventing unauthorized subject-driven text-to-image diffusion-based synthesis via meta-learning},
      author={Liu, Yixin and Fan, Chenrui and Dai, Yutong and Chen, Xun and Zhou, Pan and Sun, Lichao},
      booktitle={Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition},
      year={2024}
    }
- key: liu2024multimodal
  name: MEM
  title: 'Multimodal Unlearnable Examples: Protecting Data against Multimodal Contrastive Learning'
  authors:
  - Xinwei Liu
  - Xiaojun Jia
  - Yuan Xun
  - Siyuan Liang
  - Xiaochun Cao
  year: 2024
  date: 2024-07
  venue: ACM MM

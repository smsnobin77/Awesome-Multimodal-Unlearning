    }
- key: si2023knowledge
  name: null
  title: 'Knowledge unlearning for llms: Tasks, methods, and challenges'
  authors:
  - Nianwen Si
  - Hao Zhang
  - Heyu Chang
  - Wenlin Zhang
  - Dan Qu
  - Weiqiang Zhang
  year: 2023
  date: 2023-11
  venue: arXiv
  peer_reviewed: false
  kind: survey
  stage: null
  family: null
  tags: {}

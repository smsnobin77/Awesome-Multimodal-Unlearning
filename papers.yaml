  links:
    arxiv: https://arxiv.org/abs/2410.12761
  abstract: 'Recent advances in diffusion models have significantly enhanced their ability to generate high-quality images
    and videos, but they have also increased the risk of producing unsafe content. Existing unlearning/editing-based methods
    for safe generation remove harmful concepts from models but face several challenges: (1) They cannot instantly remove
    harmful concepts without training. (2) Their safe generation capabilities depend on collected training data. (3) They
    alter model weights, risking degradation in quality for content unrelated to toxic concepts. To address these, we propose
    SAFREE, a novel, training-free approach for safe T2I and T2V, that does not alter the model''s weights. Specifically,
    we detect a subspace corresponding to a set of toxic concepts in the text embedding space and steer prompt embeddings
    away from this subspace, thereby filtering out harmful content while preserving intended semantics. To balance the trade-off
    between filtering toxicity and preserving safe concepts, SAFREE incorporates a novel self-validating filtering mechanism
    that dynamically adjusts the denoising steps when applying the filtered embeddings. Additionally, we incorporate adaptive
    re-attention mechanisms within the diffusion latent space to selectively diminish the influence of features related to
    toxic concepts at the pixel level. In the end, SAFREE ensures coherent safety checking, preserving the fidelity, quality,
    and safety of the output. SAFREE achieves SOTA performance in suppressing unsafe content in T2I generation compared to
    training-free baselines and effectively filters targeted concepts while maintaining high-quality images. It also shows
    competitive results against training-based methods. We extend SAFREE to various T2I backbones and T2V tasks, showcasing
    its flexibility and generalization. SAFREE provides a robust and adaptable safeguard for ensuring safe visual generation.'

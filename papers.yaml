  abstract: While large language models have demonstrated impressive performance across various domains and tasks, their security
    issues have become increasingly severe. Machine unlearning has emerged as a representative approach for model safety and
    security by removing the influence of undesired data on the target model. However, these methods do not sufficiently consider
    that unlearning requests in real-world scenarios are continuously emerging, especially in the context of LLMs, which may
    lead to accumulated model utility loss that eventually becomes unacceptable. Moreover, existing LLM unlearning methods
    often ignore previous data access limitations due to privacy concerns and copyright protection. Without previous data,
    the utility preservation during unlearning is much harder. To overcome these challenges, we propose the OOO framework
    that includes an Orthogonal low-rank adapter (LoRA) for continually unlearning requested data and an Out-Of-Distribution
    (OOD) detector to measure the similarity between input and unlearning data. The orthogonal LoRA achieves parameter disentanglement
    among continual unlearning requests. The OOD detector is trained with a novel contrastive entropy loss and utilizes a
    glocal-aware scoring mechanism. During inference, our OOO framework can decide whether and to what extent to load the
    unlearning LoRA based on the OOD detector's predicted similarity between the input and the unlearned knowledge. Notably,
    OOO's effectiveness does not rely on any retained data. We conducted extensive experiments on OOO and state-of-the-art
    LLM unlearning methods across three tasks and seven datasets. The results indicate that OOO consistently achieves the
    best unlearning effectiveness and utility preservation, especially when facing continuous unlearning requests. The source
    codes can be found at https://github.com/GCYZSL/O3-LLM-UNLEARNING.

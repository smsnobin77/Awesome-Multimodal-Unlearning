[project]
name = "awesome-multimodal-unlearning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
embed = [
    "huggingface-hub>=2.2.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
]
import = [
    "pylatexenc>=2.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
